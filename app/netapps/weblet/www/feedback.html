<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>feedback</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<style type="text/css">
		* { outline: none; }
		body 
		{
		  background-color: #789; margin: 0;
		  padding: 0; font: 16px/1.4 Helvetica, Arial, sans-serif;
		}
		div.content 
		{
		  width: 300px; margin: 2em auto; padding: 20px 40px;
		  background-color: #fff; border-radius: 1em;
		}
		@media (max-width: 500px) 
		{
		  body { background-color: #fff; }
		  div.content { width: auto; margin: auto auto; padding: auto auto; }
		}
	</style>

	<script language="javascript" type="text/javascript">
        function getresponse()
        {
            if (this.readyState!=4) return;
            alert(this.responseText);
		}

		function submit()
		{
			var feedback = document.getElementById("feedback").value;
			var xmlhttp;

			if (!feedback.length) return;

			if (window.XMLHttpRequest)
				xmlhttp = new XMLHttpRequest();
			else
				xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");

			xmlhttp.onreadystatechange = getresponse;

			xmlhttp.open("POST", "/feedback", true);
			xmlhttp.send("feedback="+feedback);
		}
	</script>
</head>

<body>
  <div class="content">
		<h3>Question:</h3>
		<br />
		<textarea id="feedback" rows="20" cols="30"></textarea>
		<br /><br />
		<button type="button" onclick="document.getElementById('feedback').value=''">Clear</button>
		<button type="button" onclick="submit()">Submit</button>
  </div>
</body>
</html>
