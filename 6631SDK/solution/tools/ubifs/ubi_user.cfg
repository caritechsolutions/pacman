[ubifs]
mode=ubi
image=user.img        # 指定通过mkfs.ubifs生成的镜像
vol_id=0               # 表示volume的编号，一个ubi设备中可以有多个volume。（这种情况下，/dev下会出现 ubi0 和 ubi0_0）
vol_size=18MiB        # 表示ubi0_0的大小，即volume0的大小,设置成分区大小减5M,如果坏块多需要减的多一些
vol_type=dynamic       # 表示volume的类型，分为dynamic和static两种，其中dynamic类型的设备表示可以读写，static类型的设备表示只读
vol_alignment=1
vol_name=USER        # 表示volume的名称，在挂载ubi分区是会使用到，如在cmdline中的root=ubi0:rootfs
vol_flags=autoresize

