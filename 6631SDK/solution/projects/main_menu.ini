/********************************************************************************************************************************
* 子菜单类型一(直接左右键修改设置的子菜单)                                                                                      *
* 第1项: 自定义ID值, 固定以 "APPUI_SETTING_" 开头, projects/xxxx/xxxx/mainmenu-config.json中使用这个ID                          *
* 第2项: 子菜单的标题，可以STR_ID_XXX模式，也可以直接写字符串                                                                   *
* 第3项: 宏定义，可以为空字符串或C的宏定义字符串，这里值为空 或 这里值为宏且开启了宏，才会在主菜单中显示这个子菜单              *
* 第4项: 子菜单的按键响应函数，必须有值并在C代码中定义了这个函数                                                                *
* 第5项: 子菜单的选择内容获取函数，根据sel返回字符串                                                                            *
* 第6项: 子菜单动态显示的check函数，返回值为真时才显示这个函数                                                                  *
* 一个子菜单的显示条件: 1. mainmenu-config.json加上了这个ID; 2. 没有宏或有宏时开启了宏; 3. 没有check函数或有check函数返回真     *
* 下面定义的每个条目以左大括号开始，以右大括号截止，成员使用逗号隔开，注意换行紧随右大括号(即本行右大括号后没有字符)            *
********************************************************************************************************************************/

