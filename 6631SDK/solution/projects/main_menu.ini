/********************************************************************************************************************************
* 子菜单类型二(新建一个窗口进入的子菜单)                                                                                        *
* 第1项: 自定义ID值, 固定以 "APPUI_ENTRY_" 开头, projects/xxxx/xxxx/mainmenu-config.json中使用这个ID                            *
* 第2项: 菜单属性，多个菜单属性可以按位或同时选中                                                                               *
*           MENU_NONE_ATTR: 无需任何条件就能进入此子菜单，例如系统信息，本地文件等                                              *
*           MENU_LOCK_FORCE: 任何时候必须输入密码才能进入此子菜单，例如密码修改，父母锁等                                       *
*           MENU_LOCK_CHECK: 设置锁开启时要输入密码才能进入此子菜单，例如节目编辑，搜索等                                       *
*           MENU_NETWORK_CHECK: 必须网络连接上才能进入此子菜单，否则跳出提示，例如天气等                           *
* 第3项: 子菜单的标题，可以STR_ID_XXX模式，也可以直接写字符串                                                                   *
* 第4项: 宏定义，可以为空字符串或C的宏定义字符串，这里值为空或这里值为宏且开启了宏，才会在主菜单中显示这个子菜单                *
* 第5项: 创建子菜单窗口的函数，必须有值并在C代码中定义了这个函数                                                                *
* 第6项: 子菜单动态显示的check函数，返回值为真时才显示这个函数                                                                  *
* 一个子菜单的显示的条件: 1. mainmenu-config.json加上了这个ID; 2. 没有宏或有宏时开启了宏; 3. 没有check函数或check函数返回真     *
* 下面定义的每个条目以左大括号开始，以右大括号截止，成员使用逗号隔开，注意换行紧随右大括号(即本行右大括号后没有字符)            *
********************************************************************************************************************************/

