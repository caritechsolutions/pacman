<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>
            Web Remote
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=2.0, user-scalable=yes">
        <link href="css/style.css" rel="stylesheet" type="text/css">
        <link href="css/framework.css" rel="stylesheet" type="text/css">
        <script type="text/javascript" src="js/main.js"></script>
    </head>
    <body>
        <div class="top-deco"></div>
        <div class="content">
            <div style="height:15px"></div>
            <div style="height:65px">
                <div style="float:left; width:50%">
                    <div style="width: 110px; text-align:left; float:right">
                        <a href="###"><img src="img/remote/mute.png" height="50" id="mute" onClick="remote(this.id)"></a>
                    </div>
                </div>
                <div style="float:left; width:50%">
                    <div style="width: 110px; text-align:right; float:left">
                        <a href="fullkey.html"><img src="img/remote/keyboard.png" height="50"></a>
                    </div>
                </div>
            </div>
            <div class="container">
                <div align="center">
                    <img src="img/remote/ok.png" width="200" height="200" usemap="#Map" border="0">
                    <map name="Map" id="Map">
                      <area shape="circle" coords="99,100,46" href="###" target="_self" alt="ok" id="ok" onClick="remote(this.id)">
                      <area shape="poly" coords="4,190,56,134,47,98,64,60,3,8" href="###" target="_self" alt="left" id="left" onClick="remote(this.id)">
                      <area shape="poly" coords="12,3,70,59,101,47,134,61,190,3" href="###" target="_self" alt="up" id="up" onClick="remote(this.id)">
                      <area shape="poly" coords="140,65,150,100,140,127,198,190,197,10" href="###" target="_self" alt="right" id="right" onClick="remote(this.id)">
                      <area shape="poly" coords="62,137,102,152,137,136,190,196,9,195" href="###" target="_self" alt="down" id="down" onClick="remote(this.id)">
                    </map>
              </div>
            </div>
            <div>
                <div style="float:left; width:50%">
                    <div style="width: 110px; text-align:left; float:right">
                        <a href="###"><img src="img/remote/menu.png" height="50" id="menu" onClick="remote(this.id)"></a>
                    </div>
                </div>
                <div style="float:left; width:50%">
                    <div style="width: 110px; text-align:right; float:left">
                        <a href="###"><img src="img/remote/back.png" height="50" id="exit" onClick="remote(this.id)"></a>
                    </div>
                </div>
            </div>
            <div>
                <div align="center">
                    <a href="###"><img src="img/remote/avtv.png" height="50" id="tvr" onClick="remote(this.id)"></a>
                </div>
            </div>
            <div style="height:72px">
                <div style="float:left; width:50%">
                    <div style="width: 80px; text-align:left; float:right">
                        <a href="###"><img src="img/remote/vol-.png" height="50" id="voldown" onClick="remote(this.id)"></a>
                    </div>
                </div>
                <div style="float:left; width:50%">
                    <div style="width: 80px; text-align:right; float:left">
                        <a href="###"><img src="img/remote/vol+.png" height="50" id="volup" onClick="remote(this.id)"></a>
                    </div>
                </div>
            </div>
            <div class="colors">
                <a href="###" class="red-icon" id="red" onClick="remote(this.id)"></a> 
                <a href="###" class="green-icon" id="green" onClick="remote(this.id)"></a> 
                <a href="###" class="yellow-icon" id="yellow" onClick="remote(this.id)"></a> 
                <a href="###" class="blue-icon" id="blue" onClick="remote(this.id)"></a>
            </div>
        </div>  <!-- content -->
        <div class="downline"></div>
        <div class="footer">
            <div >
            <div class="socials">
            <a href="###" class="point-icon"></a>
            <a href="keyboard.html" class="keyboard-icon"></a> 
            <a href="programmes.html" class="prog-icon"></a>
            <a href="index.html" class="remote-icon"></a>
            </div>
            <div class="clear"></div>
            <p class="copyright">
                Copyright © 2017.<br>
                Hangzhou Nationalchip Science&amp;Technology Co, Ltd. All rights reserved.
            </p>
        </div>
    </body>
</html>
